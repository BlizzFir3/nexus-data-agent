services:
  api:
    build: 
      context: .
      target: development
    container_name: nexus_agent_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.keys 
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - ./src:/app/src
    command: npm run dev